image: maven:3-jdk-8-alpine

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - cd ./common-service
    - mvn clean install
    - cd ./target
    - mvn install:install-file -Dfile=common-service.jar -DgroupId=com.common -DartifactId=common-service -Dversion=1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true

    - cd ../../lib/oracle
    - mvn install:install-file -Dfile=ojdbc7.jar -DgroupId=com.oracle -DartifactId=ojdbc7 -Dversion=12.2.0.1 -Dpackaging=jar -DgeneratePom=true

    - cd ../../
    - mvn clean install
  artifacts:
    expire_in: 10 mins
    paths:
      - ./config-service/target
      - ./registry-service/target
      # - ./gateway-service/target
      # - ./auth-service/target
      # - ./admin-service/target
  only:
    - develop

deploy-salesapp-develop:
  stage: deploy
  image: kroniak/ssh-client
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - scp -P $SSH_PORT -T ./config-service/target/* $SSH_USER@$SSH_HOST:/project/alphaway/salesapp/develop
    #- ssh -p $SSH_PORT -T $SSH_USER@$SSH_HOST 'cd /project/alphaway/salesapp/develop && docker restart salesapp-microservices-develop'
  only:
    - develop




