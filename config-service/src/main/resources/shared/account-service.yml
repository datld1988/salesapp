spring:
  profiles:
    active: default
  jackson:
    serialization:
      # Jackson PrettyPrint
      indent-output: true
  zipkin:
    baseUrl: http://localhost:9411/
    sender:
      type: kafka
  sleuth:
    sampler:
      probability: 1.0


  datasource:
    url: jdbc:mysql://localhost:3306/db?createDatabaseIfNotExist=true
    username: user
    password: admin
    driver-class-name: com.mysql.jdbc.Driver
    initialization-mode: always
  jpa:
    database-platform: org.hibernate.dialect.MySQL5Dialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: true
        format_sql: true

security:
  oauth2:
    client:
      clientId: mobile
      clientSecret: pin
      accessTokenUri: http://localhost:8081/uaa/oauth/token
      grant-type: client_credentials
      #scope: server

server:
  servlet:
    context-path: /accounts
  port: 8082

feign:
  hystrix:
    enabled: true


sample:
  zipkin:
    # When enabled=false, traces log to the console. When enabled=true traces send to zipkin
    enabled: true