server:
  port: 8761

eureka:
  client:
    registerWithEureka: false
    fetchRegistry: false
    server:
      waitTimeInMsWhenSyncEmpty: 0
    serviceUrl:
      defaultZone: http://registry-service:8761/eureka

---
spring:
  profiles: docker

eureka:
  client:
    serviceUrl:
      defaultZone: http://registry-service:8761/eureka
  instance:
    preferIpAddress: true