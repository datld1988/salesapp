      stripPrefix: false
      sensitiveHeaders:
    admin-service:
      path: /admin/**
      serviceId: admin-service
      stripPrefix: false
      sensitiveHeaders:
    attachment-service:
      path: /attachment/**
      serviceId: attachment-service
      stripPrefix: false
      sensitiveHeaders:
    card-service:
      path: /card/**
      serviceId: card-service
      stripPrefix: false
      sensitiveHeaders:
    ebank-service:
      path: /ebank/**
      serviceId: ebank-service
      stripPrefix: false
      sensitiveHeaders:
    legal-service:
      path: /legal/**
      serviceId: legal-service
      stripPrefix: false
      sensitiveHeaders:
    log-service:
      path: /log/**
      serviceId: log-service
      stripPrefix: false
      sensitiveHeaders:
    notification-service:
      path: /notification/**
      serviceId: notification-service
      stripPrefix: false
      sensitiveHeaders:
    printout-service:
      path: /printout/**
