  config-service:
    image: openjdk:8
    container_name: config-service
    restart: on-failure
    # ports:
    #   - "8888:8888"
    volumes:
      - "./config-service/target/config-service.jar:/app.jar"
    command: ['java', '-jar', '/app.jar']
    networks:
      - sales-app-network

  registry-service:
    image: openjdk:8
    container_name: registry-service
    restart: on-failure
    # ports:
    #   - "8761:8761"
    volumes:
      - "./registry-service/target/registry-service.jar:/app.jar"
    command: ['java', '-jar', '-Dspring.profiles.active=docker', '/app.jar']
    depends_on:
      - config-service          
    networks:
      - sales-app-network

