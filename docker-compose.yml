version: '3.3'
services:
  uniform-db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'admin'
      MYSQL_ROOT_PASSWORD: 'admin'
    ports:
      - '3306:3306'
    volumes:
      - ../data/mysql:/var/lib/mysql

  uniform-zipkin:
    container_name: uniform-zipkin
    image: openzipkin/zipkin
    restart: always
    ports:
      - '9411:9411'
      
  uniform-redis:
    container_name: uniform-redis
    image: redis:latest
    volumes:
      - ../data/redis/redis.conf:/etc/redis.conf
      - ../data/redis/redis-sentinel.conf:/etc/redis-sentinel.conf
    command:
      - /bin/bash
      - -c
      - |
        redis-server --appendonly yes
        redis-server /etc/redis.conf
    ports:
      - '60379:6379'
      - '26379:26379'

  uniform-rabbitmq:
    container_name: "uniform-rabbitmq"
    image: "rabbitmq:3-management"
    restart: on-failure
    ports:
      - "15672:15672"
      - "5672:5672"

  elastic-stack:
    container_name: elastic-stack
    build: ./elastic-stack
    ports:
      - "5601:5601"
      - "9200:9200"
      - "5043:5043"
    environment:
      - MAX_MAP_COUNT=262145
      - ELASTICSEARCH_START=1
      - LOGSTASH_START=1
      - KIBANA_START=1

