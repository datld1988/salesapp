#      HOSTNAME_COMMAND: "docker info | grep ^Name: | cut -d' ' -f 2"
#      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
#      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://_{HOSTNAME_COMMAND}:9092
#      KAFKA_LISTENERS: PLAINTEXT://:9092
#      KAFKA_CREATE_TOPICS: zipkin:1:1
#      KAFKA_BROKER_ID: 1
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    restart: always
    environment:
      zk_id: "1"
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      #KAFKA_CREATE_TOPICS: zipkin:1:1
      KAFKA_CREATE_TOPICS: elk:1:1
      KAFKA_BROKER_ID: 1
    links:
      - zookeeper
    depends_on:
      - zookeeper
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9092:9092"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.5.1
    volumes:
      - ./elastic-stack/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ES_JAVA_OPTS: "-Xmx256m -Xms256m"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.5.1
    depends_on:
      - elasticsearch
    volumes:
      - ./elastic-stack/kibana/:/usr/share/kibana/config/
    ports:
      - "5601:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:7.5.1
    depends_on:
      - elasticsearch
    command: logstash -f /elk-config/logstash.config
    volumes:
      - ./elastic-stack/logstash:/elk-config
    ports:
      - "25826:25826"
