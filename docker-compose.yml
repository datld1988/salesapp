version: '3.3'
services:
  #  uniform-rabbitmq:
  #    container_name: "uniform-rabbitmq"
  #    image: "rabbitmq:3-management"
  #    restart: on-failure
  #    ports:
  #      - "15672:15672"
  #      - "5672:5672"


  uniform-zipkin:
    container_name: uniform-zipkin
    image: openzipkin/zipkin
    restart: always
    networks:
      - uniform-network
    ports:
      - '9411:9411'
      
  uniform-redis:
    container_name: uniform-redis
    image: redis:latest
    volumes:
      - ../data/redis/redis.conf:/etc/redis.conf
      - ../data/redis/redis-sentinel.conf:/etc/redis-sentinel.conf
    networks:
      - uniform-network
    command:
      - /bin/bash
      - -c
      - |
        redis-server --appendonly yes
        redis-server /etc/redis.conf
    ports:
      - '60379:6379'
      - '26379:26379'

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    restart: always
    environment:
      zk_id: "1"
    networks:
      - uniform-network
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    environment:
      #KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ADVERTISED_HOST_NAME: 192.168.1.4
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: elk:1:1
      KAFKA_BROKER_ID: 1
    links:
      - zookeeper
    depends_on:
      - zookeeper
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - uniform-network
    ports:
      - "9092:9092"

    elasticsearch:
      image: elasticsearch:7.7.0
      container_name: elasticsearch
      hostname: elasticsearch
      environment:
        - "discovery.type=single-node"
      ports:
        - 9200:9200
        - 9300:9300
      networks:
        - uniform-network

    kibana:
      image: kibana:7.7.0
      container_name: kibana
      hostname: kibana
      ports:
        - 5601:5601
      links:
        - elasticsearch:elasticsearch
      depends_on:
        - elasticsearch
      networks:
        - uniform-network

    logstash:
      image: logstash:7.7.0
      container_name: logstash
      hostname: logstash
      ports:
        - 9600:9600
        - 8089:8089
      volumes:
        - ./elastic-stack/logstash:/usr/share/logstash/pipeline/
      links:
        - elasticsearch:elasticsearch
      depends_on:
        - elasticsearch
      networks:
        - uniform-network



  account-service:
    image: uniform/account-service
    container_name: account-service
    build:
      context: .
      dockerfile: ./account-service/Dockerfile
    ports:
      - "8083:8083"
    networks:
      - uniform-network

  admin-service:
